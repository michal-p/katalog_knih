version: 2
updates:
  # 1. Track Dockerfile base images (e.g. php:8.2-apache)
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"

  # 2. Track Composer dependencies (PHP packages in composer.json)
  - package-ecosystem: "composer"
    directory: "/"
    schedule:
      interval: "weekly"
