# Virtual host configuration for any IP address (*) listening on HTTP port 80
<VirtualHost *:80>
    # Admin email address displayed on error pages
    ServerAdmin webmaster@localhost
    
    # Document root pointing to the public folder where public entry files are located
    DocumentRoot /var/www/html/public

    # Directory configuration for the public folder
    <Directory /var/www/html/public>
        # Allow .htaccess files to override configuration (essential for routing)
        AllowOverride All
        # Grant access to this directory to all incoming traffic
        Require all granted
    </Directory>

    # Log file locations (captured and displayed via docker logs)
    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
